name: Luminary AI Engine CI

on:
  push:
    branches: [main]
    paths:
      - "LuminaryEngine/**"
      - "manifest.json"
      - ".github/workflows/ai-engine-ci.yml"
  pull_request:
    paths:
      - "LuminaryEngine/**"
      - "manifest.json"
      - ".github/workflows/ai-engine-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LuminaryEngine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LuminaryEngine/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build modular frontend
        run: npm run build
